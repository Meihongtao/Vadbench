name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  report-analysis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install core deps only (no VAD engine). This also exercises the
      # packaging metadata on every supported Python, and verifies that
      # importing vadbench does not require any engine to be present.
      - name: Install package (core only)
        run: python -m pip install --quiet -e .

      - name: Run report self-tests
        run: python tests/test_report.py

      - name: Verify missing optional deps degrade gracefully
        run: python tests/check_minimal_install.py

      - name: Recompute metrics from committed results
        run: python -m vadbench.report

      - name: Fail if recomputed metrics disagree with summary CSV
        run: python -m vadbench.report | grep -q "recomputed metrics match"

      - name: Dump tables for manual comparison
        run: python tests/dump_tables.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all sources
        run: python -m compileall -q vadbench tests

      - name: Install package (core only)
        run: python -m pip install --quiet -e .

      - name: Import package and report engine inventory
        run: |
          python -c "
          import vadbench
          print('available  :', vadbench.available())
          print('unavailable:', list(vadbench.unavailable()))
          print('version    :', vadbench.__version__)
          "
