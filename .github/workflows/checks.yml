name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  report-analysis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # numpy is a core dependency (vadbench/__init__.py imports base.py, which
      # needs it). No VAD engine is installed: the post-hoc analysis reads
      # committed results/ files and never loads a model, which keeps CI fast
      # while verifying the published numbers are still reproducible.
      - name: Install core dependency
        run: python -m pip install --quiet numpy

      - name: Run report self-tests
        run: python tests/test_report.py

      - name: Verify minimal install degrades gracefully
        run: python tests/check_minimal_install.py

      - name: Recompute metrics from committed results
        run: python -m vadbench.report

      - name: Fail if recomputed metrics disagree with summary CSV
        run: python -m vadbench.report | grep -q "recomputed metrics match"

      - name: Dump tables for manual comparison
        run: python tests/dump_tables.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all sources
        run: python -m compileall -q vadbench tests

      - name: Check every module imports without heavy deps
        run: |
          python -m pip install --quiet numpy soundfile
          python -c "
          import vadbench
          from vadbench.report import collect, tables
          print('engines registered:', vadbench.available())
          print('version:', vadbench.__version__)
          "
